<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NNUE Training Tracker – Public Board</title>
  <style>
    :root {
      --bg:#1a1a1a; --fg:#e8e8e8; --muted:#a8a8a8;
      --card:#222; --border:#2a2a2a; --acc1:#d4a574; --acc2:#c9a961;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --win:#3fb950; --loss:#f85149; --neutral:#a8a8a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--sans); }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 3rem; }

    h1 {
      font-weight: 800; font-size: 2rem; letter-spacing: .2px;
      background: linear-gradient(135deg,var(--acc1),var(--acc2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--muted); margin: .35rem 0 1.25rem; }

    /* === Vertical list === */
    .runs { display: flex; flex-direction: column; gap: .9rem; }

    /* Each card is a horizontal box */
    a.card {
      display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between;
      text-decoration: none; color: inherit;
      border: 1px solid var(--border); border-radius: 12px;
      background: linear-gradient(135deg, rgba(42,42,42,.6), rgba(26,26,26,.8));
      padding: 1rem 1.1rem;
      transition: transform .08s ease, border-color .12s ease, background .12s ease;
    }
    a.card:hover { transform: translateY(-1px); border-color: #3a3a3a; }

    /* Left: title, date, notes, dataset */
    .left { min-width: 0; flex: 1 1 auto; }
    .topline { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
    .name { font-weight: 700; font-size: 1.05rem; }
    .date { color: var(--muted); font-size: .9rem; white-space: nowrap; }
    .notes { color: var(--muted); margin: .35rem 0 .5rem; }
    .kv { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .92rem; }
    .kv .label { color: var(--muted); text-transform: uppercase; font-size: .72rem; letter-spacing: .04em; }
    .kv .val { color: var(--acc1); font-family: var(--mono); }

    /* Right: compact metrics */
    .right {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(120px,1fr));
      gap: .5rem;
      align-content: start;
      margin-left: 1rem;
    }
    .metric {
      background: rgba(0,0,0,.12);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .55rem .65rem;
    }
    .metric .label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
    .metric .val { color: var(--acc1); font-family: var(--mono); font-size: .98rem; margin-top: .15rem; }

    /* Elo metric coloring */
    .metric.elo-pos .val { color: var(--win); }
    .metric.elo-neg .val { color: var(--loss); }
    .metric.elo-zero .val { color: var(--neutral); }

    /* Mobile: stack right under left */
    @media (max-width: 720px) {
      a.card { flex-direction: column; }
      .right {
        width: 100%;
        grid-template-columns: repeat(2, minmax(140px,1fr));
        margin-left: 0;
      }
    }

    .card-inline {
      border: 1px solid var(--border); border-radius: 12px;
      background: linear-gradient(135deg, rgba(42,42,42,.6), rgba(26,26,26,.8));
      padding: 1rem 1.1rem;
    }
    .notice { color: var(--muted); font-size: .9rem; }
    code { background: #00000026; padding: 0 .25rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>NNUE Training Tracker – Public Board</h1>
    <p class="subtitle">Read‑only public view. Data comes from <code>data/runs.json</code>. Click a run to see details.</p>

    <div id="content" class="card-inline"><p>Loading runs…</p></div>
  </div>

  <script type="module">
    const fmt = (n) => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString() : '—';
    const safeStr = (v, fallback='—') => (typeof v === 'string' && v.trim()) ? v : fallback;

    function eloMetric(elo) {
      if (!elo || typeof elo.diff !== 'number') return '';
      const cls  = elo.diff > 0 ? 'elo-pos' : (elo.diff < 0 ? 'elo-neg' : 'elo-zero');
      const sign = elo.diff > 0 ? '' : '-';
      const se   = (typeof elo.stdev === 'number') ? ` ± ${elo.stdev}` : '';
      const opp  = safeStr(elo.opponent, 'baseline');
      return `
        <div class="metric ${cls}">
          <div class="label">SPRT</div>
          <div class="val">${sign}${fmt(elo.diff)}${se}</div>
        </div>
      `;
    }

    function cardHTML(run) {
      const href = `run.html?id=${encodeURIComponent(String(run.id))}`;
      return `
<a class="card" href="${href}">
  <div class="left">
    <div class="topline">
      <div class="name">${safeStr(run.name)}</div>
      <div class="date">${new Date(run.date).toLocaleDateString()}</div>
    </div>

    ${safeStr(run.notes,'') ? `<p class="notes">${run.notes}</p>` : ''}

    <div class="kv">
      <div><span class="label">Dataset</span> <span class="val">${safeStr(run.datasetName)}</span></div>
    </div>
  </div>

  <div class="right">
    <div class="metric">
      <div class="label">Epochs</div>
      <div class="val">${fmt(run.epochs)}</div>
    </div>
    <div class="metric">
      <div class="label">Final Loss</div>
      <div class="val">${(+run.finalLoss||0).toFixed(4)}</div>
    </div>
    ${run.learningRate ? `
      <div class="metric">
        <div class="label">LR</div>
        <div class="val">${run.learningRate}</div>
      </div>` : ''}
    ${run.batchSize ? `
      <div class="metric">
        <div class="label">Batch</div>
        <div class="val">${fmt(run.batchSize)}</div>
      </div>` : ''}

    ${eloMetric(run.elo)}
  </div>
</a>`;
    }

    (async () => {
      const root = document.getElementById('content');
      const DATA_URL = new URL('data/runs.json', location.href).toString();

      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        const text = await res.text();
        const json = JSON.parse(text);
        if (!Array.isArray(json)) throw new Error('Invalid JSON: expected an array');

        const runs = json.filter(r => r && r.id != null && r.name && r.date);
        if (!runs.length) {
          root.innerHTML = `
            <div class="card-inline">
              <p>No runs found in <code>data/runs.json</code>.</p>
              <p class="notice" style="margin-top:.4rem">
                Add objects with at least <code>id</code>, <code>name</code>, <code>date</code>, <code>epochs</code>, and <code>finalLoss</code>.
                Optional: <code>elo</code> block.
              </p>
            </div>`;
          return;
        }

        // newest first
        runs.sort((a,b) => new Date(b.date) - new Date(a.date));

        // render vertical list of horizontal cards
        root.innerHTML = `<div class="runs">${runs.map(cardHTML).join('')}</div>`;
      } catch (err) {
        root.innerHTML = `
          <div class="card-inline">
            <p>Could not load <code>data/runs.json</code>.</p>
            <p class="notice" style="margin-top:.4rem">Error: ${String(err && err.message || err)}</p>
          </div>`;
      }
    })();
  </script>
</body>
</html>
